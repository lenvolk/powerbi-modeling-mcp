<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power BI MCP Dashboard</title>
  <style>
    /* Custom range input styling for host compatibility */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      width: 100%;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 2px;
      background: var(--vscode-input-background, #333);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      margin-top: -6px;
      border-radius: 50%;
      background: var(--vscode-button-background, #0078d4);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./mcp-app.ts"></script>
</body>
</html>
